# Vote-Kidigit · Step 33 · Tech Stack 9.5, docs/SECURITY.md 5 — Nginx rules for the domain,
# pasted into DirectAdmin → Domain → Custom HTTPD Configurations (the HTTPS server block).
# The built voter app is the document root (public_html), the staff portal is public_html/app.

# --- Security headers (both apps and the API) ---------------------------------------------
# HTTPS only for a year (PRD NFR-12). Add "preload" only after deciding to submit the domain.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Never inside a frame (clickjacking). The pages' own CSP comes from their <meta> tag; this
# header only adds frame-ancestors, which a <meta> cannot set.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# Result and invitation links carry tokens in the path: never send them to other sites.
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# --- API -----------------------------------------------------------------------------------
location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The client's real address only. The API trusts exactly one proxy hop, so a header the
    # client sends itself can never choose the address used by rate limits and the audit log.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;          # report generation for events up to 5,000 voters
    client_max_body_size 12m;         # CSV imports (10 MB) and photo ZIPs
}

# Delivery reports carry BEEM_DLR_SECRET in the query string: keep them out of access logs.
location /api/webhooks/ {
    access_log off;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# USSD callbacks (step 37: /api/ussd/beem/callback?secret=…): the secret is in the query
# string, so no access log; the API checks it and the IP allow-list.
location /api/ussd/ {
    access_log off;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- Frontends (single-page apps) ----------------------------------------------------------
# Built files have content hashes in their names: cache them for a year.
location ~* ^/(app/)?assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# index.html must never be cached, so a deploy is picked up at once.
location /app/ {
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    try_files $uri /app/index.html;
}

location / {
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    try_files $uri /index.html;
}
