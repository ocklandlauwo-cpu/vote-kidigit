packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'
saveExact: true
# Step 32 security review (owner-approved): multer under @nestjs/platform-express 11.2.8 has a
# high-severity DoS fixed in 2.5.0; pinned here until NestJS ships it (Tech Stack 4.x change log).
overrides:
  multer: 2.5.0
engineStrict: true
# Tech Stack 5.3: the only packages allowed to run install scripts
allowBuilds:
  argon2: true
  puppeteer: true
  prisma: true
  '@prisma/engines': true
  sharp: true
  # Denied (pnpm 11 fails the install on unreviewed scripts). Jest's file watcher ships
  # prebuilt binaries as optional dependencies; its script only builds from source as a fallback.
  '@parcel/watcher': false
  # esbuild (via @nestjs/cli and ts-jest) and BullMQ's msgpackr-extract also ship prebuilt binaries as optional
  # dependencies; their scripts only verify or build from source (msgpackr falls back to JS).
  esbuild: false
  msgpackr-extract: false
minimumReleaseAgeExclude:
  - '@tailwindcss/node@4.3.4'
  - '@tailwindcss/oxide-android-arm64@4.3.4'
  - '@tailwindcss/oxide-darwin-arm64@4.3.4'
  - '@tailwindcss/oxide-darwin-x64@4.3.4'
  - '@tailwindcss/oxide-freebsd-x64@4.3.4'
  - '@tailwindcss/oxide-linux-arm-gnueabihf@4.3.4'
  - '@tailwindcss/oxide-linux-arm64-gnu@4.3.4'
  - '@tailwindcss/oxide-linux-arm64-musl@4.3.4'
  - '@tailwindcss/oxide-linux-x64-gnu@4.3.4'
  - '@tailwindcss/oxide-linux-x64-musl@4.3.4'
  - '@tailwindcss/oxide-wasm32-wasi@4.3.4'
  - '@tailwindcss/oxide-win32-arm64-msvc@4.3.4'
  - '@tailwindcss/oxide-win32-x64-msvc@4.3.4'
  - '@tailwindcss/oxide@4.3.4'
  - '@tailwindcss/vite@4.3.4'
  - tailwindcss@4.3.4
